<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卡牌衝突 換卡配對</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header id="topbar" hidden>
  <div class="bar">
    <strong class="brand">卡牌衝突</strong>
    <select id="villagePicker" aria-label="選擇村莊"></select>
    <button id="logoutBtn" class="ghost" type="button">登出</button>
  </div>
  <nav class="tabs">
    <button data-view="collection" class="active" type="button">我的收藏</button>
    <button data-view="matches" type="button">配對</button>
    <button data-view="clan" type="button">部落總覽</button>
    <button data-view="villages" type="button">村莊</button>
  </nav>
</header>

<main>

  <!-- 登入 -->
  <section id="view-login" class="view">
    <div class="card intro">
      <h1>卡牌衝突 換卡配對</h1>
      <p>登記自己缺什麼、多什麼，自動算出部落裡跟誰換、換哪張。</p>
    </div>

    <form id="loginForm" class="card">
      <h2>驗證你的村莊</h2>
      <label>村莊標籤
        <input id="tagInput" name="tag" placeholder="#9QRUL2CVJ" autocapitalize="characters"
               autocomplete="off" spellcheck="false" required>
      </label>
      <label>遊戲內 API 權杖
        <input id="tokenInput" name="token" placeholder="8 碼權杖" autocomplete="off"
               spellcheck="false" required>
      </label>
      <details class="howto" data-guide open>
        <summary>權杖要去哪裡拿？</summary>
      </details>
      <button type="submit" class="primary">驗證並登入</button>
      <p class="error" id="loginError" hidden></p>
    </form>
  </section>

  <!-- 我的收藏 -->
  <section id="view-collection" class="view" hidden>
    <div class="card sticky-summary">
      <div class="progress-row" id="seriesProgress"></div>
      <div class="save-row">
        <span id="saveState" class="hint">—</span>
        <button id="saveBtn" class="primary" type="button">儲存</button>
      </div>
    </div>
    <div id="collectionBody"></div>
  </section>

  <!-- 配對 -->
  <section id="view-matches" class="view" hidden>
    <div class="card">
      <label class="switch">
        <input type="checkbox" id="sameClanOnly" checked>
        <span>只顯示同部落（不同部落換不了）</span>
      </label>
      <p class="hint" id="matchSummary">—</p>
      <p class="warn" id="syncWarn" hidden>部落資訊同步失敗，以下顯示的是快取資料，可能已過時。</p>
    </div>
    <div id="matchBody"></div>
  </section>

  <!-- 部落總覽 -->
  <section id="view-clan" class="view" hidden>
    <div id="clanBody"></div>
  </section>

  <!-- 村莊管理 -->
  <section id="view-villages" class="view" hidden>
    <div id="villageList"></div>
    <form id="addForm" class="card">
      <h2>加綁另一個村莊</h2>
      <p class="hint">小號要各自通過權杖驗證。綁定後可在上方切換，不用重新登入。</p>
      <label>村莊標籤
        <input id="addTag" placeholder="#XXXXXXX" autocapitalize="characters"
               autocomplete="off" spellcheck="false" required>
      </label>
      <label>遊戲內 API 權杖
        <input id="addToken" placeholder="8 碼權杖" autocomplete="off" spellcheck="false" required>
      </label>
      <details class="howto" data-guide>
        <summary>權杖要去哪裡拿？</summary>
      </details>
      <button type="submit" class="primary">驗證並加綁</button>
      <p class="error" id="addError" hidden></p>
    </form>
  </section>

</main>

<!-- 取得權杖的圖解。登入頁與加綁小號兩處共用，由 app.js 複製進 [data-guide]。 -->
<template id="tokenGuide">
  <ol class="steps">
    <li>
      <p>打開《部落衝突》，點右下角的<b>齒輪</b>。</p>
      <a href="/static/img/token-1-settings.jpg" target="_blank" rel="noopener">
        <img src="/static/img/token-1-settings.jpg" alt="村莊畫面右下角的齒輪按鈕" loading="lazy">
      </a>
    </li>
    <li>
      <p>拉到設定視窗最下面，點<b>更多設定</b>。</p>
      <a href="/static/img/token-2-more.jpg" target="_blank" rel="noopener">
        <img src="/static/img/token-2-more.jpg" alt="設定視窗底部的「更多設定」按鈕" loading="lazy">
      </a>
      <p class="hint">
        順帶一提，<b>村莊標籤</b>就在這個設定視窗最上方的 Supercell ID 那一列，
        <code>#</code> 開頭那串。
      </p>
    </li>
    <li>
      <p>找到 <b>API Token</b> 區塊，點<b>顯示</b>，把出現的 8 碼複製起來。</p>
      <a href="/static/img/token-3-show.jpg" target="_blank" rel="noopener">
        <img src="/static/img/token-3-show.jpg" alt="更多設定裡 API Token 的「顯示」按鈕" loading="lazy">
      </a>
    </li>
  </ol>
  <p class="hint">圖片點一下可以放大看。</p>
  <p class="hint">
    本站只拿這組權杖<b>驗證一次</b>，不會儲存它。權杖在遊戲裡會定期更換，
    如果驗證失敗，回遊戲重新<b>顯示</b>一次拿最新的。
  </p>
</template>

<script src="/static/app.js"></script>
</body>
</html>
