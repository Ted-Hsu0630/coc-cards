<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>卡牌衝突 換卡配對</title>
<link rel="stylesheet" href="/static/style.css">

<!-- 加到主畫面後全螢幕開啟（display: standalone）。沒有 Service Worker，
     所以 Android Chrome 不會主動跳安裝橫幅，要從選單「加到主畫面」。
     這站離線等於沒用，為了那個橫幅去養一份快取不划算。 -->
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#1e222c">
<link rel="icon" href="/static/img/favicon-32.png" sizes="32x32">
<!-- iOS 16.4 以前不看 manifest，這兩行是給舊版的。狀態列用 black 不用
     black-translucent —— 後者會讓內容鑽到狀態列底下，而登入畫面沒有頂欄
     可以吃 safe-area，標題會直接被時鐘壓到。 -->
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="換卡配對">
</head>
<body>

<header id="topbar" hidden>
  <div class="bar">
    <strong class="brand">卡牌衝突</strong>
    <select id="villagePicker" aria-label="選擇村莊"></select>
    <button id="logoutBtn" class="ghost" type="button">登出</button>
  </div>
  <nav class="tabs">
    <button data-view="collection" class="active" type="button">我的收藏</button>
    <button data-view="import" type="button" hidden>截圖匯入</button>
    <button data-view="matches" type="button">配對</button>
    <button data-view="clan" type="button">部落總覽</button>
    <button data-view="villages" type="button">村莊</button>
  </nav>
</header>

<main>

  <!-- 登入 -->
  <section id="view-login" class="view">
    <div class="card intro">
      <h1>卡牌衝突 換卡配對</h1>
      <p>登記缺什麼、多什麼，自動算出跟誰換、換哪張。</p>
    </div>

    <form id="loginForm" class="card">
      <h2>驗證村莊</h2>
      <label>村莊標籤
        <input id="tagInput" name="tag" placeholder="#XXXXXXXXX" autocapitalize="characters"
               autocomplete="off" spellcheck="false" required>
      </label>
      <label>遊戲內 API 權杖
        <input id="tokenInput" name="token" placeholder="8 碼權杖" autocomplete="off"
               spellcheck="false" required>
      </label>
      <details class="howto" data-guide>
        <summary>權杖要去哪裡拿？</summary>
      </details>
      <button type="submit" class="primary">驗證並登入</button>
      <p class="error" id="loginError" hidden></p>
    </form>
  </section>

  <!-- 我的收藏 -->
  <section id="view-collection" class="view" hidden>
    <div class="card sticky-summary">
      <div class="progress-row" id="seriesProgress"></div>
      <div class="save-row">
        <span id="saveState" class="hint">—</span>
        <button id="saveBtn" class="primary" type="button">儲存</button>
      </div>
    </div>
    <div id="collectionBody"></div>
  </section>

  <!-- 配對 -->
  <section id="view-matches" class="view" hidden>
    <div class="card">
      <label class="switch">
        <input type="checkbox" id="sameClanOnly" checked>
        <span>只顯示同部落</span>
      </label>
      <p class="hint" id="matchSummary">—</p>
      <p class="warn" id="syncWarn" hidden>部落資訊同步失敗，以下為舊資料。</p>
    </div>
    <div id="matchBody"></div>
  </section>

  <!-- 部落總覽 -->
  <section id="view-clan" class="view" hidden>
    <div class="card">
      <label class="switch">
        <input type="checkbox" id="clanSameOnly" checked>
        <span>只顯示同部落</span>
      </label>
    </div>
    <div id="clanBody"></div>
  </section>

  <!-- 截圖匯入 -->
  <section id="view-import" class="view" hidden>
    <form id="importForm" class="card">
      <h2>用截圖填收藏</h2>
      <p class="hint">
        打開相簿，由上往下每頁拍一張，<b>5 張拍完 60 格</b>。
        相簿以外的畫面會自動略過。
      </p>
      <!-- 張數由 /api/import/available 填入，不要寫死：後端改了 MAX_IMAGES
           之後這裡會繼續講舊數字，而使用者要等到上傳被拒絕才發現。 -->
      <label>選擇截圖（一次最多 <span id="importMax"></span> 張）
        <input id="importFiles" type="file" accept="image/*" multiple>
      </label>
      <button type="submit" class="primary" id="importBtn" disabled>開始辨識</button>
      <p class="hint">辨識結果需經確認，<b>確認前不會變更收藏</b>。</p>
      <p class="error" id="importError" hidden></p>
    </form>

    <div id="importResult" hidden>
      <div class="card">
        <h2>每張圖的結果</h2>
        <ul class="filelist" id="importFileList"></ul>
      </div>

      <div class="card" id="importSummary"></div>

      <div class="card" id="importNeedsCard" hidden>
        <h2 id="importNeedsTitle"></h2>
        <p class="hint">
          認不出的格子<b>留白</b>，不會猜。不填則保持原樣。
        </p>
        <div id="importNeeds"></div>
      </div>

      <div class="card">
        <h2>讀出來的</h2>
        <p class="hint">將覆蓋目前的收藏，可直接修改。</p>
        <div id="importRead"></div>
      </div>

      <div class="card save-row">
        <span class="hint" id="importApplyHint"></span>
        <button type="button" class="ghost" id="importCancel">取消</button>
        <button type="button" class="primary" id="importApply">套用到我的收藏</button>
      </div>
    </div>
  </section>

  <!-- 村莊管理 -->
  <section id="view-villages" class="view" hidden>
    <div id="villageList"></div>
    <form id="addForm" class="card">
      <h2>加綁另一個村莊</h2>
      <p class="hint">小號需各自驗證。綁定後可在上方切換。</p>
      <label>村莊標籤
        <input id="addTag" placeholder="#XXXXXXXXX" autocapitalize="characters"
               autocomplete="off" spellcheck="false" required>
      </label>
      <label>遊戲內 API 權杖
        <input id="addToken" placeholder="8 碼權杖" autocomplete="off" spellcheck="false" required>
      </label>
      <details class="howto" data-guide>
        <summary>權杖要去哪裡拿？</summary>
      </details>
      <button type="submit" class="primary">驗證並加綁</button>
      <p class="error" id="addError" hidden></p>
    </form>
  </section>

</main>

<!-- 取得權杖的圖解。登入頁與加綁小號兩處共用，由 app.js 複製進 [data-guide]。 -->
<template id="tokenGuide">
  <ol class="steps">
    <li>
      <p>打開《部落衝突》，點右下角的<b>齒輪</b>。</p>
      <img src="/static/img/token-1-settings.jpg" alt="村莊畫面右下角的齒輪按鈕" loading="lazy">
    </li>
    <li>
      <p>捲到最下面，點<b>更多設定</b>。</p>
      <img src="/static/img/token-2-more.jpg" alt="設定視窗底部的「更多設定」按鈕" loading="lazy">
      <p class="hint">
        <b>村莊標籤</b>在同一個視窗最上方的 Supercell ID 那一列，<code>#</code> 開頭那串。
      </p>
    </li>
    <li>
      <p>找到 <b>API Token</b>，點<b>顯示</b>，複製出現的 8 碼。</p>
      <img src="/static/img/token-3-show.jpg" alt="更多設定裡 API Token 的「顯示」按鈕" loading="lazy">
    </li>
  </ol>
  <p class="hint">
    僅用於<b>驗證帳號所有權</b>，不會儲存。權杖會定期更換，驗證失敗請回遊戲重新<b>顯示</b>。
  </p>
</template>

<script src="/static/app.js"></script>
</body>
</html>
